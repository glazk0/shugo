services:
  shugo:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: ghcr.io/glazk0/shugo:${VERSION:-latest}
    restart: unless-stopped
    stop_grace_period: 35s
    env_file: .env
    read_only: true
    volumes:
      - shugo-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  shugo-data:
